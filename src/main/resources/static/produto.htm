<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine - Manutenção de Produtos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Sixtyfour+Convergence&display=swap');
    </style>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="libs/materialize.min.css" type="text/css">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>
<div class="container">
    <div class="row">
        <div class="col s12">
            <h4>Formulário de Manutenção de Produto</h4>
        </div>
    </div>
    <form id="frmProduto">
        <input type="hidden" name="id" id="id"/>
        <div class="row">
            <div class="col s12 l12 input-field">
                <input type="text" name="nome" id="nome" required/>
                <label for="nome">Nome do Produto:</label>
            </div>
        </div>
        <div class="row">
            <div class="col s12 l6 input-field">
                <input type="number" step="0.01" name="precoCusto" id="precoCusto" required/>
                <label for="precoCusto">Preço de Custo (R$):</label>
            </div>
            <div class="col s12 l6 input-field">
                <input type="number" step="0.01" name="precoVenda" id="precoVenda" required/>
                <label for="precoVenda">Preço de Venda (R$):</label>
            </div>
        </div>
        <div class="row">
            <div class="col s12 l6 input-field">
                <input type="number" name="estoque" id="estoque" required/>
                <label for="estoque">Estoque Atual:</label>
            </div>
            <div class="col s12 l6 input-field">
                <input type="number" name="estoqueMinimo" id="estoqueMinimo" required/>
                <label for="estoqueMinimo">Estoque Mínimo:</label>
            </div>
        </div>
        <div class="row">
            <div class="col s12">
                <a class="waves-effect waves-light btn blue darken-3" onclick="salvar()">
                    <i class="material-icons left">cloud</i>Salvar Produto
                </a>
                <a class="waves-effect waves-light btn grey darken-1" onclick="limparFormulario()" style="margin-left: 10px;">
                    <i class="material-icons left">clear_all</i>Limpar / Novo
                </a>
            </div>
        </div>
    </form>

    <div class="divider"></div>
    <div class="section">
        <h5>Lista de Produtos</h5>
        <div id="listaProdutos">


        </div>
    </div>
</div>

<script src="libs/jquery-3.4.1.min.js"></script>
<script src="libs/materialize.min.js"></script>
<script src="libs/jquery.mask.js"></script>
<script src="js/app.js"></script>
<script src="js/produto.js"></script>
<div id="dialog" title="ATENÇÃO!" style="display: none">
    <p class="center-align">
        <i class="material-icons medium amber-text">info</i><br />
        <span class="indigo-text" id="msgResp"></span>
    </p>
</div>

<div id="dialogAguarde" class="modal">
    <div class="modal-content center-align">
        <h4>Aguarde...</h4>
        <div class="preloader-wrapper active">
            <div class="spinner-layer spinner-blue-only">
                <div class="circle-clipper left"><div class="circle"></div></div>
                <div class="gap-patch"><div class="circle"></div></div>
                <div class="circle-clipper right"><div class="circle"></div></div>
            </div>
        </div>
    </div>
</div>

<div id="modalConfirmacao" class="modal">
    <div class="modal-content">
        <h4>Confirmação</h4>
        <p id="textoConfirmacao">Deseja realmente excluir este produto?</p>
    </div>
    <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect waves-red btn-flat">Cancelar</a>
        <a href="#!" id="btnConfirmarExclusao" class="modal-close waves-effect waves-green btn-flat red-text">Excluir</a>
    </div>
</div>
</body>
</html>
